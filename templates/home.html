<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Student Score Prediction</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f8f9fa;
    }
    .form-container {
      max-width: 700px;
      margin: 50px auto;
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.15);
    }
    .result-box {
      margin-top: 20px;
      padding: 20px;
      background-color: #d1e7dd;
      border-left: 5px solid #0f5132;
      border-radius: 10px;
      color: #0f5132;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container form-container">
    <h2 class="text-center mb-4">Student Performance Predictor</h2>
    <form method="post" action="/predictdata">
      <div class="row g-3">
        <div class="col-md-6">
          <label for="gender" class="form-label">Gender</label>
          <select class="form-select" name="gender" id="gender" required>
            <option value="female">Female</option>
            <option value="male">Male</option>
          </select>
        </div>

        <div class="col-md-6">
          <label for="ethnicity" class="form-label">Race/Ethnicity</label>
          <select class="form-select" name="ethnicity" id="ethnicity" required>
            <option value="group A">Group A</option>
            <option value="group B">Group B</option>
            <option value="group C">Group C</option>
            <option value="group D">Group D</option>
            <option value="group E">Group E</option>
          </select>
        </div>

        <div class="col-12">
          <label for="parental_level_of_education" class="form-label">Parental Level of Education</label>
          <select class="form-select" name="parental_level_of_education" id="parental_level_of_education" required>
            <option value="some high school">Some High School</option>
            <option value="high school">High School</option>
            <option value="some college">Some College</option>
            <option value="associate's degree">Associate's Degree</option>
            <option value="bachelor's degree">Bachelor's Degree</option>
            <option value="master's degree">Master's Degree</option>
          </select>
        </div>

        <div class="col-md-6">
          <label for="lunch" class="form-label">Lunch</label>
          <select class="form-select" name="lunch" id="lunch" required>
            <option value="standard">Standard</option>
            <option value="free/reduced">Free/Reduced</option>
          </select>
        </div>

        <div class="col-md-6">
          <label for="test_preparation_course" class="form-label">Test Preparation Course</label>
          <select class="form-select" name="test_preparation_course" id="test_preparation_course" required>
            <option value="completed">Completed</option>
            <option value="none">None</option>
          </select>
        </div>

        <div class="col-md-6">
          <label for="reading_score" class="form-label">Reading Score</label>
          <input type="number" class="form-control" name="reading_score" id="reading_score" min="0" max="100" required>
        </div>

        <div class="col-md-6">
          <label for="writing_score" class="form-label">Writing Score</label>
          <input type="number" class="form-control" name="writing_score" id="writing_score" min="0" max="100" required>
        </div>
      </div>

      <div class="text-center mt-4">
        <button type="submit" class="btn btn-primary btn-lg">Predict Math Score</button>
      </div>
    </form>

    {% if results %}
      <div class="result-box text-center mt-4">
        Predicted Math Score: {{ results }}
      </div>
    {% endif %}
  </div>
</body>
</html>
